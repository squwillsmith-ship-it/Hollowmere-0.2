name: G2 cottage reference repair - real model generation and Godot gate
on:
  push:
    branches: [art/g2-cottage-elevation-reference-repair-20261030]
    paths:
      - .github/workflows/g2-cottage-reference-one-shot.yml
      - tools/repair_g2_cottage_reference.py
permissions:
  contents: write
jobs:
  verify-and-save:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mesh test and engine prerequisites
        run: |
          python -m pip install --quiet numpy Pillow trimesh scipy
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 libasound2t64 libpulse0 libfontconfig1 unzip
      - name: Generate corrected real 3D G2 cottage GLBs at original owner paths
        run: |
          python tools/repair_g2_cottage_reference.py
          python tests/test_g2_reference_cottage.py
      - name: Generate original reference dependencies
        run: |
          python tools/generate_step21_materials.py
          python tools/generate_step21_glb.py
          python tools/generate_phase_b_surfaces.py
          python tools/generate_phase_b_reference_glb.py
      - name: Install pinned Godot 4.7.2 Standard
        run: python tools/test_environment.py doctor --install
      - name: Run full existing Godot and Python regression suite
        run: python tools/test_environment.py check --godot .qa-tools/Godot_v4.7.2-stable_linux.x86_64
      - name: Capture genuine Forward+ Vulkan renderer scenes
        run: python tools/test_environment.py render --godot .qa-tools/Godot_v4.7.2-stable_linux.x86_64
      - name: Capture close original cottage views using actual engine
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GODOT_HEADLESS: 'false'
        run: |
          mkdir -p build
          xvfb-run -a -s '-screen 0 1280x720x24' .qa-tools/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path game --script res://tests/test_g2_cottage_close_capture.gd 2>&1 | tee build/qa-g2-cottage-reference-capture.log
      - name: Commit only successfully tested model assets to recovery-safe branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add game/assets/models/g2/cottage/part_*.glb art/g2/cottage_model_manifest.json art/g2/g2_cottage_reference_fix_manifest.json
          git commit -m 'art(g2): real cottage front/rear/roof geometry corrected and engine tested'
          git push origin HEAD:refs/heads/art/g2-cottage-elevation-reference-repair-20261030
      - name: Archive test logs and actual screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-cottage-reference-repair-actual-Godot-evidence
          path: |
            build/qa-*.log
            build/qa-environment.json
            build/*.png
          if-no-files-found: warn
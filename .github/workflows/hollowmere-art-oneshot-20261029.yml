name: Hollowmere — isolated final-art exact-source QA
on:
  push:
    branches:
      - art/final-visual-production-20261029
    paths:
      - .github/workflows/hollowmere-art-oneshot-20261029.yml
permissions:
  contents: read
concurrency:
  group: hollowmere-art-once-20261029
  cancel-in-progress: false
jobs:
  linux-vulkan-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out pinned working branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and render prerequisites
        run: |
          python -m pip install --quiet numpy Pillow trimesh scipy
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 libasound2t64 libpulse0 libfontconfig1 unzip
      - name: Regenerate the established editable art outputs
        run: |
          python tools/generate_step21_materials.py
          python tools/generate_step21_glb.py
          python tools/generate_phase_b_surfaces.py
          python tools/generate_phase_b_reference_glb.py
      - name: Install official checksum-pinned Godot Standard 4.7.2
        run: |
          python tools/test_environment.py doctor --install
          test -x .qa-tools/Godot_v4.7.2-stable_linux.x86_64
      # Companion to the first run's full Godot/Python suite. This second
      # workflow-only revision captures 66 1280x720 actual frames. The game
      # source blobs must be exactly identical to the tested earlier SHA.
      - name: Full 10-view / 42-site / teardown Vulkan capture matrix
        run: |
          python tools/visual_capture_matrix.py --godot .qa-tools/Godot_v4.7.2-stable_linux.x86_64 --mode forward_plus
      - name: Preserve machine-readable QA and genuine screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowmere-final-art-exact-sha-${{ github.sha }}
          path: |
            build/qa-*.log
            build/qa-environment.json
            build/*.png
            build/visual-forward_plus/**
          if-no-files-found: warn

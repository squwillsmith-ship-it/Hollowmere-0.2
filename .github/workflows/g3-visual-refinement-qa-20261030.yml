name: Hollowmere G3 distinctive architecture and landscape QA
on:
  push:
    branches: [art/g3-visual-identity-terrain-20261030]
    paths: ['.github/workflows/g3-visual-refinement-qa-20261030.yml']
permissions:
  contents: write
jobs:
  g3-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vulkan environment and source dependencies
        run: |
          python -m pip install --quiet numpy Pillow trimesh scipy
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 libasound2t64 libpulse0 libfontconfig1 unzip
      - name: Restore authored existing model dependencies
        run: |
          python tools/generate_step21_materials.py
          python tools/generate_step21_glb.py
          python tools/generate_phase_b_surfaces.py
          python tools/generate_phase_b_reference_glb.py
      - name: Integrity check of imported model textures
        run: python -m unittest discover -s tests -p 'test_g3_model_assets.py' -v
      - name: Install official verified Godot 4.7.2
        run: python tools/test_environment.py doctor --install
      - name: Complete G3 gameplay and visual-regression suite
        run: python tools/test_environment.py check --godot .qa-tools/Godot_v4.7.2-stable_linux.x86_64
      - name: Real engine renderer and frame audit
        if: success()
        run: python tools/test_environment.py render --godot .qa-tools/Godot_v4.7.2-stable_linux.x86_64
      - name: Render twenty-one real village views and night/fog
        if: success()
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GODOT_HEADLESS: 'false'
        run: |
          mkdir -p build
          HOLLOWMERE_G3_21_RENDER_DIR="$PWD/build" xvfb-run -a -s '-screen 0 1280x720x24' .qa-tools/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path game --script res://tests/test_g3_all_site_capture.gd | tee build/qa-g3-21-site-vulkan.log
          grep -q HOLLOWMERE_G3_TWENTY_ONE_SITES_VULKAN_OK build/qa-g3-21-site-vulkan.log
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps
          files=sorted(Path('build').glob('g3-site-*.png'))
          assert len(files)==23, f'Expected 23 views, got {len(files)}'
          w,h=320,195
          image=Image.new('RGB',(w*4,(h+24)*6),(28,34,36))
          draw=ImageDraw.Draw(image)
          for i,file in enumerate(files):
              x,y=(i%4)*w,(i//4)*(h+24)
              with Image.open(file) as pic:
                  image.paste(ImageOps.fit(pic.convert('RGB'),(w-8,h-8)),(x+4,y+18))
              draw.text((x+5,y+2),file.stem,fill=(220,229,222))
          image.save('build/g3-final-visual-contact.jpg',quality=92,subsampling=0)
          print('G3_VISUAL_CONTACT_23_REAL_FRAMES')
          PY
      - name: Attach real render contact to isolated G3 draft
        if: success()
        continue-on-error: true
        run: |
          mkdir -p art/g3/qa
          cp build/g3-final-visual-contact.jpg art/g3/qa/g3-final-visual-contact-20261030.jpg
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add art/g3/qa/g3-final-visual-contact-20261030.jpg
          git commit -m 'test(g3): capture revised identity, terrain and weather from real Vulkan'
          git push origin HEAD:refs/heads/art/g3-visual-identity-terrain-20261030
      - name: Save QA evidence regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowmere-g3-visual-signatures-qa
          path: |
            build/qa-*.log
            build/qa-environment.json
            build/*.png
            build/g3-final-visual-contact.jpg
          if-no-files-found: warn

name: Hollowmere — one-time Windows graphical smoke 2026-10-29

on:
  push:
    branches:
      - qa/windows-visual-20261029

permissions:
  contents: read

jobs:
  actual-windows-graphical-probe:
    runs-on: windows-2022
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore authored art textures and build dependencies
        shell: pwsh
        run: |
          python -m pip install --quiet numpy Pillow trimesh scipy
          python tools/generate_step21_materials.py
          python tools/generate_step21_glb.py
          python tools/generate_phase_b_surfaces.py
          python tools/generate_phase_b_reference_glb.py
      - name: Install pinned official Godot 4.7.2 Windows Standard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force '.qa-tools' | Out-Null
          $file = '.qa-tools/Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') { throw 'Official Windows Godot integrity mismatch' }
          Expand-Archive $file -DestinationPath .qa-tools -Force
          & '.qa-tools/Godot_v4.7.2-stable_win64.exe' --version
      - name: Import current source without a display first
        shell: pwsh
        run: |
          & '.qa-tools/Godot_v4.7.2-stable_win64.exe' --headless --path game --editor --quit
      - name: Attempt real windowed Windows Forward+ and OpenGL framebuffer capture
        shell: pwsh
        run: |
          python tools/windows_visual_probe.py --godot .qa-tools/Godot_v4.7.2-stable_win64.exe
      - name: Preserve renderer logs and any genuine Windows game frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowmere-windows-windowed-visual-${{ github.sha }}
          path: |
            build/windows-visual/**/*.png
            build/windows-visual/**/*.log
            build/windows-visual/*.json
          if-no-files-found: warn

name: Hollowmere G1 one-shot Godot 4.7.2 validation
# Temporary branch-specific G1 QA: DO NOT merge or retain as main workflow.
on:
  push:
    branches:
      - qa/g1-oneshot-20261030
    paths:
      - .github/workflows/hollowmere-g1-oneshot-20261030.yml

permissions:
  contents: read

concurrency:
  group: hollowmere-g1-oneshot-20261030
  cancel-in-progress: false

jobs:
  godot-engine-and-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned editor dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libasound2t64 libpulse0 libfontconfig1 unzip xvfb
          python -m pip install --quiet numpy Pillow trimesh scipy
      - name: Generate reproducible game assets
        run: |
          python tools/generate_step21_materials.py
          python tools/generate_step21_glb.py
          python tools/generate_phase_b_surfaces.py
          python tools/generate_phase_b_reference_glb.py
      - name: Install official SHA256-pinned Godot
        run: python tools/test_environment.py doctor --install
      - name: Run all current Python/Godot, physics, save, and G1 route tests
        run: python tools/test_environment.py check --godot .qa-tools/Godot_v4.7.2-stable_linux.x86_64
      - name: Publish complete engine logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowmere-g1-engine-${{ github.sha }}
          path: |
            build/qa-*.log
            build/qa-environment.json
          if-no-files-found: warn
          retention-days: 14

  godot-vulkan-g1-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Vulkan software display and image inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 libasound2t64 libpulse0 libfontconfig1 unzip
          python -m pip install --quiet numpy Pillow trimesh scipy
      - name: Restore procedural material sources
        run: |
          python tools/generate_step21_materials.py
          python tools/generate_step21_glb.py
          python tools/generate_phase_b_surfaces.py
          python tools/generate_phase_b_reference_glb.py
      - name: Install SHA256-pinned Godot
        run: python tools/test_environment.py doctor --install
      - name: Import project and scripts in real Godot
        run: |
          mkdir -p build/g1
          .qa-tools/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --quit > build/g1-import.log 2>&1 || { tail -120 build/g1-import.log; exit 1; }
      - name: Capture five true Forward+/Vulkan G1 frames at fixed poses
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GODOT_HEADLESS: "false"
        run: |
          export HOLLOWMERE_G1_CAPTURE_DIR="$PWD/build/g1"
          xvfb-run -a -s "-screen 0 1280x720x24" .qa-tools/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --rendering-method forward_plus --rendering-driver vulkan --path game --script res://tests/test_g1_harbour_capture.gd > build/g1-capture.log 2>&1 || { tail -120 build/g1-capture.log; exit 1; }
          grep -F HOLLOWMERE_G1_CAPTURE_OK build/g1-capture.log
      - name: Verify genuine nonuniform framebuffer files and save manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json
          folder=Path("build/g1")
          names=("01_quay_eye","02_warehouse_eye","03_cottage_eye","04_embankment_eye","05_coastal_wide")
          record={}
          for name in names:
              f=folder/("g1-"+name+".png")
              with Image.open(f) as im:
                  im.load()
                  if im.size[0]<640 or im.size[1]<360: raise ValueError(f"Small frame: {f}")
                  unique=len(set(im.convert("RGB").resize((32,18)).getdata()))
                  if unique<12: raise ValueError(f"Nonvarying framebuffer: {f}")
                  record[name]={"sha256":hashlib.sha256(f.read_bytes()).hexdigest(),"size":im.size,"sampled_colors":unique}
          (folder/"capture-manifest.json").write_text(json.dumps({"g1_source":"4e9f0409be312df851d0f3cc7a59c209ba5ea974","workflow":"G1 QA branch code identical to G1 source except temporary workflow","rendering":"Forward+ Vulkan Mesa software","human_visual_signoff":False,"files":record},indent=2))
          print("G1_5_REAL_VULKAN_FRAMES_VALID")
          PY
      - name: Upload exact-source frames and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowmere-g1-vulkan-${{ github.sha }}
          path: |
            build/g1/*.png
            build/g1/*.json
            build/g1-import.log
            build/g1-capture.log
            build/qa-*.log
            build/qa-environment.json
          if-no-files-found: warn
          retention-days: 14
